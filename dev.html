<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>one · dev</title>
    <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    body {
      background: #f2f0e5;
      color: #212123;
      font-family: Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    canvas {
      display: block;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* The wall of games, when there is no ?game=. It is the front page's wall:
       the same flex sizing, the same clips out of media/, the same title in the
       same colour. What it adds is what only dev shows: the games the build
       skips, and a module that failed to import. */
    body.index {
      display: block;
      overflow: auto;
      padding: 26px;
      font: 14px/1.45 Verdana, sans-serif;
      touch-action: auto;
    }
    .index header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      height: 28px;
      margin: 0 0 24px;
    }
    .index h1 {
      margin: 0;
      font: bold 19px/1.45 Verdana, sans-serif;
      letter-spacing: -.02em;
    }
    .index .by {
      margin: 0;
      font-size: 11px;
      color: #21212399;
    }
    /* Flex and not grid, and the count sizes the card, so a row of n fills the
       width exactly. The five queries are the gallery's. */
    #cards {
      --gap: 14px;
      --n: 2;
      --card: calc((100% - (var(--n) - 1) * var(--gap)) / var(--n));
      display: flex;
      flex-wrap: wrap;
      gap: var(--gap);
      list-style: none;
      margin: 0;
      padding: 0;
    }
    @media (min-width: 560px) {
      #cards {
        --n: 3;
      }
    }
    @media (min-width: 820px) {
      #cards {
        --n: 4;
      }
    }
    @media (min-width: 1080px) {
      #cards {
        --n: 5;
      }
    }
    @media (min-width: 1340px) {
      #cards {
        --n: 6;
      }
    }
    /* A container, so the title and the badge are the same fraction of the
       square at every card count. */
    #cards li {
      flex: 0 0 var(--card);
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      container-type: inline-size;
    }
    #cards a {
      position: absolute;
      inset: 0;
      color: inherit;
      text-decoration: none;
    }
    /* The recorded clip. A game with none is flat --bg, which is the clip's own
       background too, so the title reads either way. */
    #cards video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .tag {
      position: absolute;
      left: 0;
      bottom: 0;
      margin: 0;
      padding: 0 4.5cqw 4cqw;
      font: bold 10cqw/1.1 Verdana;
      letter-spacing: -.02em;
    }
    .tag time {
      margin-left: 2.8cqw;
      letter-spacing: 0;
      font: 4.5cqw Verdana, sans-serif;
      opacity: .55;
      font-variant-numeric: tabular-nums;
    }
    /* draft, or a module that threw on import. Top right, in the red the
       card's edge is drawn in and not in the card's own ink: the two say the
       same thing, and the ink is the colour the title reads the board in. */
    .flag {
      position: absolute;
      right: 0;
      top: 0;
      margin: 0;
      padding: 3.5cqw 4.5cqw;
      font: bold 4.5cqw Verdana, sans-serif;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: #c22;
    }
    /* The flag again at the card's edge, so it reads from across the wall. It
       is inside the square and not around it: a border would take 4px off
       every card, flagged or not, and every card is the square the front page
       will show. Red on both, and never the card's own ink, which is a
       different colour on every card and would read as part of the picture. A
       pseudo-element and not an outline, because the clip is positioned and
       paints over an outline; ::after is the last child, so it paints over the
       clip. */
    #cards li.draft::after,
    #cards li.error::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 4px solid #c22;
      pointer-events: none;
    }
    p.help {
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
    }
    code {
      background: #0001;
      padding: 2px 6px;
    }
    /* The recorder's bar and preview, which src/dev/rec.js builds and
       only a ?game= page loads. */
    #rec-bar {
      position: fixed;
      left: 8px;
      bottom: 8px;
      z-index: 9;
      display: flex;
      gap: 10px;
      align-items: center;
      font: 12px ui-monospace, monospace;
      color: #0009;
    }
    #rec-bar[data-on] {
      color: #c22;
    }
    #rec-bar button,
    #rec-preview button {
      font: inherit;
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #0003;
      border-radius: 4px;
      background: #fff8;
      color: inherit;
    }
    #rec-preview {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
      background: #000c;
      font: 13px ui-monospace, monospace;
      color: #fff;
    }
    #rec-preview[hidden] {
      display: none;
    }
    /* Square and inside the window: a flex column shrinks the canvas on the main
       axis alone and stretches the frames. */
    #rec-preview canvas {
      flex: none;
      width: 72vmin;
      height: 72vmin;
    }
    #rec-preview p {
      margin: 0;
      opacity: .7;
    }
    #rec-preview div {
      display: flex;
      gap: 8px;
    }
    #rec-preview button {
      background: #fff;
      color: #000;
      padding: 6px 18px;
    }
    #rec-preview button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }
    </style>
  </head>
  <body>
    <!--
      Runs a game straight from src/, with no build step: the browser loads the
      same ES modules the bundler does. ~/web is served at
      https://marx.giraffe-yo.ts.net/, so this is one.fserb.com's source, live.

        dev.html               every game in src/, as the front page's wall
        dev.html?game=wow      that game, running, like the built page
        &rec=0                 without the recorder, for an embedded iframe

      A game page also loads src/dev/rec.js, the recorder behind the "rec"
      button in the corner. It records a ten second clip for the gallery card.
      `./task record` opens this page in headless Chrome and presses it.

      The built pages under www/ are what actually ships. `./task build` makes them.
    -->
    <script type="module">
    const params = new URLSearchParams(location.search);
    const name = params.get("game") ?? location.hash.slice(1);

    if (name) {
      const canvas = document.createElement("canvas");
      canvas.id = "canvas";
      document.body.append(canvas);

      const game = await import(`./src/${name}.js`);
      const { run } = await import("./src/lib/one.js");
      const screen = run(game);

      // After run(), so the recorder's frame callback lands after the game's.
      // ?rec=0 skips it, so a page embedding dev.html in an iframe does not
      // get the recorder's bar in the corner of every game.
      if (params.get("rec") !== "0") {
        const rec = await import("./src/dev/rec.js");
        rec.init(screen, name);
        // tools/record.js drives rec.auto() over CDP, and a module's exports
        // are reachable from nowhere else.
        window.rec = rec;
      }
    } else {
      await index();
    }

    /*
     * The wall, with no build step behind it. Everything tools/build.js reads
     * off the disk this reads off the server: Caddy's `file_server browse`
     * answers a directory with JSON when the request asks for JSON, so src/
     * names the games and media/ says which ones have a recorded card, and meta
     * comes from importing each module the way build.js imports it.
     *
     * So it shows what the front page will show, one commit early: a game with
     * no card is a flat board here and there, and a card recorded but not yet
     * built is already on this wall.
     */
    async function index() {
      document.body.className = "index";

      let names;
      try {
        names = await list("./src/", (e) => !e.is_dir && e.name.endsWith(".js"));
      } catch (err) {
        document.body.innerHTML = `<p class=help>no directory listing here: ` +
          `${esc(err.message)}<br>pick a game: ` +
          `<code>dev.html?game=&lt;name&gt;</code></p>`;
        return;
      }
      names = names.map((n) => n.slice(0, -3)).filter((n) => !n.startsWith("_"));

      // A game whose clip is missing is a flat card, so this is not fatal.
      const shots = new Set(
        await list("./media/", (e) => e.is_dir).catch(() => []),
      );

      // The same colours the panels and the built card are drawn in.
      const { theme } = await import("./src/lib/overlay.js");

      const games = await Promise.all(names.map(async (name) => {
        try {
          const { meta } = await import(`./src/${name}.js`);
          return { name, ...meta, shot: shots.has(name) };
        } catch (err) {
          return { name, error: String(err) };
        }
      }));
      // Newest first, undated to the end, like the gallery.
      games.sort((a, b) =>
        (b.date ?? "").localeCompare(a.date ?? "") || a.name.localeCompare(b.name)
      );

      document.body.innerHTML = `<header>
        <h1>one · dev</h1>
        <p class=by>${games.length} games from src/</p>
      </header>
      <ul id=cards>${games.map((g) => card(g, theme)).join("")}</ul>`;

      play([...document.querySelectorAll("#cards video")]);
    }

    // One directory off the server's listing, filtered, as names. A directory
    // comes back as "media/" and the trailing slash is not part of the name.
    async function list(path, keep) {
      const res = await fetch(path, {
        headers: { accept: "application/json" },
      });
      if (!res.ok) throw new Error(`${path} gave ${res.status}`);
      const entries = await res.json();
      return entries.filter(keep).map((e) => e.name.replace(/\/$/, ""));
    }

    function card(g, theme) {
      const m = { bg: "#f2f0e5", fg: "#212123", ...g };
      // The title in the panel fill and not the panel text: it sits straight on
      // the clip with no panel behind it. What the built card does.
      const ink = theme(m).bg;
      const clip = g.shot
        ? `<video src="./media/${g.name}/card.mp4" ` +
          `poster="./media/${g.name}/card.png" loop muted playsinline ` +
          `preload=none></video>`
        : "";
      // Hover text, which the front page's cards deliberately have not got: a
      // card there is a picture of a game, and this is the tool.
      const tip = g.error ?? (g.desc ?? "").trim();
      // What the build would do with this game: nothing, or skip it. draft
      // keeps a game out of www/ and off the front page; an import that threw
      // has no meta, so the build would stop on it. One word, and it is both
      // the badge and the class the red edge hangs off.
      const flag = g.error ? "error" : g.draft ? "draft" : "";
      return `<li${flag ? ` class=${flag}` : ""} ` +
        `style="--bg:${esc(m.bg)};--ink:${esc(ink)}">
        <a href="?game=${encodeURIComponent(g.name)}"${
          tip ? ` title="${esc(tip)}"` : ""
        }>
          ${clip}
          <p class="tag"><b>${esc(g.name)}</b><time>${
          esc((g.date ?? "").slice(0, 4))
        }</time></p>
          ${flag ? `<p class="flag ${flag}">${flag}</p>` : ""}
        </a>
      </li>`;
    }

    // The card under the pointer is the one running, and the rest hold the
    // frame they stopped on. The gallery's rule, so the wall moves here the way
    // it moves there: one square at a time, and a screen with no pointer plays
    // whatever is on it.
    function play(videos) {
      if (!matchMedia("(hover: hover)").matches) {
        const onscreen = new IntersectionObserver((es) => {
          for (const e of es) {
            if (e.isIntersecting) e.target.play().catch(() => {});
            else e.target.pause();
          }
        }, { rootMargin: "200px" });
        for (const v of videos) onscreen.observe(v);
        return;
      }
      for (const v of videos) {
        const li = v.closest("li");
        // pointermove and not pointerenter: coming back from a game restores
        // this page under a pointer that crossed no card's edge.
        li.addEventListener("pointermove", () => {
          if (v.paused) v.play().catch(() => {});
        });
        li.addEventListener("pointerleave", () => v.pause());
      }
      // A clip out of the back/forward cache is playing if that card was the
      // one pressed through, wherever the pointer is now.
      addEventListener("pageshow", () => videos.forEach((v) => v.pause()));
    }

    function esc(s) {
      return String(s).replace(
        /[&<>"]/g,
        (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
      );
    }
    </script>
  </body>
</html>
