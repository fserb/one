<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>one · dev</title>
    <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    body {
      background: #f2f0e5;
      color: #212123;
      font-family: Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    canvas {
      display: block;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* The list of games, when there is no ?game=. */
    body.index {
      display: block;
      overflow: auto;
      padding: 32px 20px;
      font-size: 14px;
      line-height: 1.5;
    }
    .index main {
      max-width: 54em;
      margin: 0 auto;
    }
    .index h1 {
      font-size: 14px;
      margin: 0 0 16px;
    }
    .index ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .index li {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 8px 4px;
      border-top: 1px solid #0002;
    }
    .index a {
      color: inherit;
      font-weight: bold;
      min-width: 8em;
    }
    .swatch {
      width: 16px;
      height: 16px;
      flex: none;
    }
    .desc {
      flex: 1;
      color: #0009;
    }
    .date {
      color: #0006;
      font-variant-numeric: tabular-nums;
    }
    /* Always in the row, empty for a game that ships, so the dates line up. */
    .flag {
      flex: none;
      min-width: 4em;
      text-align: right;
    }
    .flag b {
      font: 11px Verdana, sans-serif;
      color: #a33;
      border: 1px solid #a33;
      border-radius: 3px;
      padding: 1px 4px;
    }
    .flag b.broken {
      color: #f2f0e5;
      background: #a33;
    }
    p.help {
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
    }
    code {
      background: #0001;
      padding: 2px 6px;
    }
    /* The recorder's bar and preview, which src/dev/rec.js builds and
       only a ?game= page loads. */
    #rec-bar {
      position: fixed;
      left: 8px;
      bottom: 8px;
      z-index: 9;
      display: flex;
      gap: 10px;
      align-items: center;
      font: 12px ui-monospace, monospace;
      color: #0009;
    }
    #rec-bar[data-on] {
      color: #c22;
    }
    #rec-bar button,
    #rec-preview button {
      font: inherit;
      padding: 4px 10px;
      cursor: pointer;
      border: 1px solid #0003;
      border-radius: 4px;
      background: #fff8;
      color: inherit;
    }
    #rec-preview {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
      background: #000c;
      font: 13px ui-monospace, monospace;
      color: #fff;
    }
    #rec-preview[hidden] {
      display: none;
    }
    /* Square and inside the window: a flex column shrinks the canvas on the main
       axis alone and stretches the frames. */
    #rec-preview canvas {
      flex: none;
      width: 72vmin;
      height: 72vmin;
    }
    #rec-preview p {
      margin: 0;
      opacity: .7;
    }
    #rec-preview div {
      display: flex;
      gap: 8px;
    }
    #rec-preview button {
      background: #fff;
      color: #000;
      padding: 6px 18px;
    }
    #rec-preview button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }
    </style>
  </head>
  <body>
    <!--
      Runs a game straight from src/, with no build step: the browser loads the
      same ES modules the bundler does. ~/web is served at
      https://marx.giraffe-yo.ts.net/, so this is one.fserb.com's source, live.

        dev.html               every game in src/, listed
        dev.html?game=wow      that game, running, like the built page

      A game page also loads src/dev/rec.js, the recorder behind the "rec"
      button in the corner. It records a ten second clip for the gallery card.

      The built pages under www/ are what actually ships. `./task build` makes them.
    -->
    <script type="module">
    const params = new URLSearchParams(location.search);
    const name = params.get("game") ?? location.hash.slice(1);

    if (name) {
      const canvas = document.createElement("canvas");
      canvas.id = "canvas";
      document.body.append(canvas);

      const game = await import(`./src/${name}.js`);
      const { run } = await import("./src/lib/one.js");
      const screen = run(game);

      // After run(), so the recorder's frame callback lands after the game's.
      const rec = await import("./src/dev/rec.js");
      rec.init(screen, name);
    } else {
      await index();
    }

    // The list, with no build step behind it: Caddy's `file_server browse`
    // answers a directory with JSON when the request asks for JSON, and meta
    // comes from importing each module, the same way tools/build.js reads it.
    async function index() {
      document.body.className = "index";

      let names;
      try {
        names = await list();
      } catch (err) {
        document.body.innerHTML = `<p class=help>no directory listing here: ` +
          `${esc(err.message)}<br>pick a game: ` +
          `<code>dev.html?game=&lt;name&gt;</code></p>`;
        return;
      }

      const games = await Promise.all(names.map(async (name) => {
        try {
          const { meta } = await import(`./src/${name}.js`);
          return { name, ...meta };
        } catch (err) {
          return { name, desc: String(err), broken: true };
        }
      }));
      games.sort((a, b) => (b.date ?? "").localeCompare(a.date ?? ""));

      document.body.innerHTML = `<main>
        <h1>one · dev <span class=date>${games.length} games</span></h1>
        <ul>${games.map(card).join("")}</ul>
      </main>`;
    }

    // Names of the game modules, from the server's directory listing. Same two
    // rules as the build: no directories, nothing starting with _.
    async function list() {
      const res = await fetch("./src/", { headers: { accept: "application/json" } });
      if (!res.ok) throw new Error(`src/ gave ${res.status}`);
      const entries = await res.json();
      return entries
        .filter((e) => !e.is_dir && e.name.endsWith(".js"))
        .map((e) => e.name.slice(0, -3))
        .filter((n) => !n.startsWith("_"));
    }

    function card(g) {
      const bg = g.bg ?? "#f2f0e5";
      const fg = g.fg ?? "#212123";
      return `<li>
        <span class=swatch style="background:${esc(bg)};border:3px solid ${
        esc(fg)
      }"></span>
        <a href="?game=${encodeURIComponent(g.name)}">${esc(g.name)}</a>
        <span class=desc>${esc((g.desc ?? "").trim().replace(/\n/g, " · "))}</span>
        <span class=flag>${flag(g)}</span>
        <span class=date>${esc(g.date ?? "")}</span>
      </li>`;
    }

    // draft says the build skips this game: no page under www/, no gallery card.
    function flag(g) {
      if (g.broken) return `<b class=broken>error</b>`;
      if (g.draft) return `<b>draft</b>`;
      return "";
    }

    function esc(s) {
      return String(s).replace(
        /[&<>"]/g,
        (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
      );
    }
    </script>
  </body>
</html>
