<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>one tiny game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="a collection of tiny web games">
<link rel="canonical" href="{{url}}">
<meta property="og:title" content="one tiny game">
<meta property="og:type" content="website">
<meta property="og:description" content="a collection of tiny web games">
<meta property="og:url" content="{{url}}">
<meta name="theme-color" content="#f2f0e5">
<link rel="icon" href="{{icon}}">
<style>{{fonts}}</style>
<style>
/* Pressing a card is a real navigation. Both documents opt in here, so the
   browser animates the card into that page's board instead of replacing one
   page with the other. */
@view-transition { navigation: auto; }
* { box-sizing: border-box; }
/* Reserved on the game's page too, so the viewport is the same width on both
   sides of the transition and nothing shifts sideways. */
html { background: #f2f0e5; scrollbar-gutter: stable; }
body {
  margin: 0;
  padding: 26px;
  font: 14px/1.45 var(--sans);
  color: #212123;
}
/* The same rules as a game's page, so the site's name does not move across
   the transition. */
header {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: 12px;
  height: 28px;
  margin: 0 0 24px;
}
.site { margin: 0; font: bold 19px/1.45 var(--sans); letter-spacing: -.02em; }
.by { margin: 0; font-size: 11px; color: #21212399; }
.game {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  font: bold 19px/1.45 var(--sans);
  letter-spacing: -.02em;
}
header a { color: inherit; }
.site a { text-decoration: none; }
.site a:hover { text-decoration: underline; }
.src { margin-left: auto; align-self: center; }
.src svg { display: block; width: 18px; height: 18px; fill: currentColor; opacity: .4; }
.src:hover svg { opacity: 1; }
/* Hidden here and visible on a game's page, so the site's name starts at the
   same x on both. */
.arrow { visibility: hidden; }
a .arrow { visibility: visible; }
@media (max-width: 560px) {
  .game { position: static; transform: none; margin-left: auto; }
}

/* Flex, not grid: the count sizes the card and a row of n fills the width
   exactly, without a grid's fixed tracks. */
#cards {
  --gap: 14px;
  --n: 2;
  --card: calc((100% - (var(--n) - 1) * var(--gap)) / var(--n));
  display: flex;
  flex-wrap: wrap;
  gap: var(--gap);
  list-style: none;
  margin: 0;
  padding: 0;
}
@media (min-width: 560px) { #cards { --n: 3; } }
@media (min-width: 820px) { #cards { --n: 4; } }
@media (min-width: 1080px) { #cards { --n: 5; } }
@media (min-width: 1340px) { #cards { --n: 6; } }

/* A card is a picture, not a paragraph: dragging across the page should not
   select half the titles. */
li {
  flex: 0 0 var(--card);
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  container-type: inline-size;
}
li > a { position: absolute; inset: 0; color: inherit; text-decoration: none; }
/* A game with no clip is flat --bg, which is the clip's own background too, so
   the title is readable either way. */
li video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
/* Bottom left, since what a game draws is usually higher up and centred. */
.title {
  position: absolute;
  left: 0;
  bottom: 0;
  margin: 0;
  padding: 0 4.5cqw 4cqw;
  font: bold 10cqw/1.1 var(--sans);
  letter-spacing: -.02em;
}
.title time {
  margin-left: 2.8cqw;
  letter-spacing: 0;
  font: 4.5cqw var(--sans);
  opacity: .55;
  font-variant-numeric: tabular-nums;
}

/* Both pages have these: the pseudo-elements belong to the document being
   navigated to, so each direction uses the destination's copy. */
::view-transition-group(board) {
  animation-duration: 420ms;
  animation-timing-function: cubic-bezier(.4,0,.15,1);
}
::view-transition-old(board) { animation-duration: 300ms; }
::view-transition-new(board) { animation-duration: 140ms; }
</style>
</head>
<body>
<header>
  <h1 class="site"><span class="arrow">&larr;</span> one tiny game</h1>
  <p class="by">by <a href="https://fserb.com">fserb</a></p>
  <a class="src" href="https://github.com/fserb/one" aria-label="source on GitHub">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
  </a>
</header>
<ul id="cards">
{{cards}}
</ul>
<script type="module">
/*
 * The cards are plain links, so this page needs no script to work. What the
 * script adds is which card the browser animates into the game's page: the one
 * being navigated from gets `view-transition-name: board`, the name that page's
 * board uses. It has to be that card and no other, because a name has to be
 * unique in the document at the moment the snapshot is taken.
 */
const list = document.getElementById("cards");

// The one card under the pointer plays; the rest stay on the frame they stopped
// on, and one the pointer has never been over shows its poster. A screen with
// no pointer cannot report hover, so there the clips play while on screen.
const videos = [...list.querySelectorAll("video")];

if (matchMedia("(hover: hover)").matches) {
  for (const v of videos) {
    const li = v.closest("li");
    // pointermove and not pointerenter: coming back from a game restores this
    // page under a pointer that moved over no card's edge, so no enter fires.
    li.addEventListener("pointermove", () => {
      if (v.paused) v.play().catch(() => {});
    });
    li.addEventListener("pointerleave", () => v.pause());
  }
  // A clip restored from the back/forward cache resumes where it was, which is
  // playing if that card was the one pressed.
  addEventListener("pageshow", () => videos.forEach((v) => v.pause()));
} else {
  const onscreen = new IntersectionObserver((es) => {
    for (const e of es) {
      if (e.isIntersecting) e.target.play().catch(() => {});
      else e.target.pause();
    }
  }, { rootMargin: "200px" });
  for (const v of videos) onscreen.observe(v);
}

let marked = null;

function mark(url) {
  if (marked) marked.style.viewTransitionName = "";
  marked = [...list.querySelectorAll("a")].find((a) => a.href === url)
    ?.closest("li") ?? null;
  if (marked) marked.style.viewTransitionName = "board";
  return marked;
}

// Named before this page's snapshot is taken. A navigation off the site leaves
// nothing named and the whole page cross-fades instead.
addEventListener("pageswap", (e) => {
  if (e.viewTransition) mark(e.activation?.entry.url);
});

// A fresh load of this page has the card scrolled off the top, and the board
// would animate to a position off screen.
addEventListener("pagereveal", (e) => {
  if (!e.viewTransition) return;
  const li = mark(globalThis.navigation?.activation?.from?.url);
  const box = li?.getBoundingClientRect();
  if (box && (box.top < 0 || box.bottom > innerHeight)) {
    li.scrollIntoView({ block: "center", behavior: "instant" });
  }
});
</script>
</body>
</html>
