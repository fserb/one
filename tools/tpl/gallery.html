<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>one tiny game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="a collection of tiny web games">
<link rel="canonical" href="{{url}}">
<meta property="og:title" content="one tiny game">
<meta property="og:type" content="website">
<meta property="og:description" content="a collection of tiny web games">
<meta property="og:url" content="{{url}}">
<meta name="theme-color" content="#f2f0e5">
<link rel="icon" href="{{icon}}">
<style>
/* Pressing a card is a real navigation. Both documents opt in here, so the
   browser morphs the card into that page's board instead of cutting. */
@view-transition { navigation: auto; }
* { box-sizing: border-box; }
/* Reserved on the game's page too, so the viewport is the same width on both
   sides of the transition and nothing slides sideways. */
html { background: #f2f0e5; scrollbar-gutter: stable; }
body {
  margin: 0;
  padding: 26px;
  font: 14px/1.45 Verdana, sans-serif;
  color: #212123;
}
/* The same rules as a game's page, so the site's name holds still across the
   transition. */
header {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: 12px;
  height: 28px;
  margin: 0 0 24px;
}
.site { margin: 0; font: bold 19px/1.45 Verdana, sans-serif; letter-spacing: -.02em; }
.by { margin: 0; font-size: 11px; color: #21212399; }
.game {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  font: bold 19px/1.45 Verdana, sans-serif;
  letter-spacing: -.02em;
}
header a { color: inherit; }
.site a { text-decoration: none; }
.site a:hover { text-decoration: underline; }
/* Hidden here and visible on a game's page, so the site's name starts at the
   same x on both. */
.arrow { visibility: hidden; }
a .arrow { visibility: visible; }
@media (max-width: 560px) {
  .game { position: static; transform: none; margin-left: auto; }
}

/* Flex, not grid: the count sizes the card and a row of n fills the width
   exactly, without a grid's fixed tracks. */
#cards {
  --gap: 14px;
  --n: 2;
  --card: calc((100% - (var(--n) - 1) * var(--gap)) / var(--n));
  display: flex;
  flex-wrap: wrap;
  gap: var(--gap);
  list-style: none;
  margin: 0;
  padding: 0;
}
@media (min-width: 560px) { #cards { --n: 3; } }
@media (min-width: 820px) { #cards { --n: 4; } }
@media (min-width: 1080px) { #cards { --n: 5; } }
@media (min-width: 1340px) { #cards { --n: 6; } }

/* A card is a picture, not a paragraph: dragging across the wall should not
   leave half the titles highlighted. */
li {
  flex: 0 0 var(--card);
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  container-type: inline-size;
}
li > a { position: absolute; inset: 0; color: inherit; text-decoration: none; }
/* A game with no clip is flat --bg, which is the clip's own background too, so
   the title reads either way. */
li video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
/* Bottom left, since the board's own action tends to sit high and centred. */
.tag {
  position: absolute;
  left: 0;
  bottom: 0;
  margin: 0;
  padding: 0 4.5cqw 4cqw;
  font: bold 10cqw/1.1 Verdana;
  letter-spacing: -.02em;
}
.tag time {
  margin-left: 2.8cqw;
  letter-spacing: 0;
  font: 4.5cqw Verdana, sans-serif;
  opacity: .55;
  font-variant-numeric: tabular-nums;
}

/* Both pages carry these: the pseudo-elements belong to whichever document is
   arriving, so each direction reads the destination's copy. */
::view-transition-group(board) {
  animation-duration: 420ms;
  animation-timing-function: cubic-bezier(.4,0,.15,1);
}
::view-transition-old(board) { animation-duration: 300ms; }
::view-transition-new(board) { animation-duration: 140ms; }
</style>
</head>
<body>
<header>
  <h1 class="site"><span class="arrow">&larr;</span> one tiny game</h1>
  <p class="by">by <a href="https://fserb.com">fserb</a></p>
</header>
<ul id="cards">
{{cards}}
</ul>
<script type="module">
/*
 * The cards are plain links, so this page needs no script to work. What the
 * script adds is which card the browser hands to the game's page: the one being
 * left through takes `view-transition-name: board`, the name that page's board
 * carries. It has to be that card and no other, because a name has to be unique
 * in the document at the moment the snapshot is taken.
 */
const list = document.getElementById("cards");

// The one card under the pointer runs; the rest hold the frame they stopped on,
// and one never pointed at holds its poster. A screen with no pointer has no
// way to ask, so there the clips play while they are on screen.
const videos = [...list.querySelectorAll("video")];

if (matchMedia("(hover: hover)").matches) {
  for (const v of videos) {
    const li = v.closest("li");
    // pointermove and not pointerenter: coming back from a game restores this
    // page under a pointer that crossed no card's edge, so no enter is owed.
    li.addEventListener("pointermove", () => {
      if (v.paused) v.play().catch(() => {});
    });
    li.addEventListener("pointerleave", () => v.pause());
  }
  // A clip restored from the back/forward cache picks up where it was paused,
  // which is playing if the card was pressed through.
  addEventListener("pageshow", () => videos.forEach((v) => v.pause()));
} else {
  const onscreen = new IntersectionObserver((es) => {
    for (const e of es) {
      if (e.isIntersecting) e.target.play().catch(() => {});
      else e.target.pause();
    }
  }, { rootMargin: "200px" });
  for (const v of videos) onscreen.observe(v);
}

let marked = null;

function mark(url) {
  if (marked) marked.style.viewTransitionName = "";
  marked = [...list.querySelectorAll("a")].find((a) => a.href === url)
    ?.closest("li") ?? null;
  if (marked) marked.style.viewTransitionName = "board";
  return marked;
}

// Named before this page's snapshot is taken. A navigation off the site leaves
// nothing named and the whole page cross-fades instead.
addEventListener("pageswap", (e) => {
  if (e.viewTransition) mark(e.activation?.entry.url);
});

// A fresh load of this page has the card scrolled off the top, and the board
// would fly to somewhere nobody can see.
addEventListener("pagereveal", (e) => {
  if (!e.viewTransition) return;
  const li = mark(globalThis.navigation?.activation?.from?.url);
  const box = li?.getBoundingClientRect();
  if (box && (box.top < 0 || box.bottom > innerHeight)) {
    li.scrollIntoView({ block: "center", behavior: "instant" });
  }
});
</script>
</body>
</html>
