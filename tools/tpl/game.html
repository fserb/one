<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="canonical" href="{{url}}">
<meta property="og:title" content="{{title}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{url}}">
{{image}}
<meta name="theme-color" content="#f2f0e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{title}}">
<link rel="icon" href="{{icon}}">
<style>{{fonts}}</style>
<style>
/* This page is the game framed the way the card frames it, so opening this
   URL shows what pressing the card shows. */
@view-transition { navigation: auto; }
* { box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; }
/* Reserved here as well as on the gallery, so the viewport is the same width on
   both sides of the transition and nothing shifts sideways. */
html { background: #f2f0e5; scrollbar-gutter: stable; }
/* A drag across the board is the game being played, not a selection. */
body {
  --pad: 0px;
  height: 100dvh;
  padding: 26px;
  display: flex;
  flex-direction: column;
  font: 14px/1.45 var(--sans);
  color: #212123;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* The same rules as the gallery's, so the site's name does not move across the
   transition. The height is fixed because the board below is sized off it. */
header {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: 12px;
  height: 28px;
  margin: 0 0 24px;
}
.site { margin: 0; font: bold 19px/1.45 var(--sans); letter-spacing: -.02em; }
.by { margin: 0; font-size: 11px; color: #21212399; }
.game {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  font: bold 19px/1.45 var(--sans);
  letter-spacing: -.02em;
}
header a { color: inherit; }
.site a { text-decoration: none; }
.site a:hover { text-decoration: underline; }
.src { margin-left: auto; align-self: center; }
.src svg { display: block; width: 18px; height: 18px; fill: currentColor; opacity: .4; }
.src:hover svg { opacity: 1; }
/* The gallery has the same character and hides it, so the site's name starts
   at the same x on both pages. */
.arrow { visibility: hidden; }
a .arrow { visibility: visible; }
/* Too narrow to centre the name without it overlapping the byline. */
@media (max-width: 560px) {
  .game { position: static; transform: none; margin-left: auto; }
}

/* Centred in the space below the header: 100dvh less this page's padding, the
   header and its margin. meta.bg is on the element rather than here, because
   this stylesheet is minified and the CSS parser drops a placeholder inside a
   declaration; the attribute is what colours the first frame drawn. */
.board {
  position: relative;
  margin: auto;
  width: min(calc(100dvh - 104px - var(--pad)), 100%);
  aspect-ratio: 1;
  view-transition-name: board;
}
canvas { display: block; cursor: pointer; touch-action: none; }

/* The pad a game is steered with on a screen that has no mouse on it: the four
   directions on the left, act on the right, and both below the board rather
   than over it, so a finger on the board is still the pointer. input.js puts
   the `dpad` class on <body> for a game whose meta asks for a pad, then binds
   these two elements, names the directions it is reading in `data-held` and
   puts `on` on the button. Outlines in currentColor, the page's ink, at the
   weight the type on this page is, and a shape fills in while it is held. */
.pad {
  display: none;
  flex: none;
  align-items: center;
  justify-content: space-between;
  height: var(--pad);
  touch-action: none;
}
.pad svg { display: block; aspect-ratio: 1; }
.dirs { width: min(42vw, 26dvh); }
.act { width: min(26vw, 16dvh); }
.pad path, .pad circle {
  fill: none;
  stroke: currentColor;
  stroke-width: 4;
  stroke-linejoin: round;
  opacity: .35;
}
.dirs[data-held~="up"] .up,
.dirs[data-held~="right"] .right,
.dirs[data-held~="down"] .down,
.dirs[data-held~="left"] .left,
.act.on circle { fill: currentColor; opacity: .8; }

/* A screen with no mouse on it. The board gives the bottom third of the page
   to the pad, which is what --pad takes off its size above. */
@media (pointer: coarse) and (hover: none) {
  body.dpad { --pad: 32dvh; }
  body.dpad .pad { display: flex; }
}
/* A phone on its side has no height to give away and width to spare, so the
   two go in the margins either side of the board and the board keeps its size.
   Fixed, and transparent to a pointer between them, so a press in the middle
   is the board's. */
@media (pointer: coarse) and (hover: none) and (orientation: landscape) {
  body.dpad { --pad: 0px; }
  body.dpad .pad {
    position: fixed;
    inset: 78px 26px 26px;
    height: auto;
    pointer-events: none;
  }
  body.dpad .pad > * { pointer-events: auto; }
}
/* Both pages have these: the pseudo-elements belong to the document being
   navigated to, so each direction uses the destination's copy. */
::view-transition-group(board) {
  animation-duration: 420ms;
  animation-timing-function: cubic-bezier(.4,0,.15,1);
}
::view-transition-old(board) { animation-duration: 300ms; }
::view-transition-new(board) { animation-duration: 140ms; }
</style>
</head>
<body>
<header>
  <p class="site"><a id="back" href="../"><span class="arrow">&larr;</span> one tiny game</a></p>
  <p class="by">by <a href="https://fserb.com">fserb</a></p>
  <h1 class="game">{{title}}</h1>
  <a class="src" href="{{source}}" aria-label="source on GitHub">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
  </a>
</header>
<main class="board" style="background:{{bg}}"><canvas id="canvas"></canvas></main>
<div class="pad">
  <svg class="dirs" viewBox="0 0 100 100">
    <path class="up" d="M50 4 L64 27 L36 27 Z"/>
    <path class="right" d="M96 50 L73 64 L73 36 Z"/>
    <path class="down" d="M50 96 L36 73 L64 73 Z"/>
    <path class="left" d="M4 50 L27 36 L27 64 Z"/>
  </svg>
  <svg class="act" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/></svg>
</div>
<script type="module">
// Going back restores the gallery from the back/forward cache, with its scroll
// position and its playing clips. Anything else follows the link and loads it.
const back = document.getElementById("back");
const home = new URL("../", location.href).href;

back.addEventListener("click", (ev) => {
  if (globalThis.navigation?.activation?.from?.url !== home) return;
  ev.preventDefault();
  history.back();
});

// input.js listens on the window and stops only the keys that scroll, so
// Escape arrives here whatever the board is doing.
addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") back.click();
});
</script>
<script type="module">{{script}}</script>
</body>
</html>
