<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="{{desc}}">
<link rel="canonical" href="{{url}}">
<meta property="og:title" content="{{title}}">
<meta property="og:type" content="website">
<meta property="og:description" content="{{desc}}">
<meta property="og:url" content="{{url}}">
{{image}}
<meta name="theme-color" content="#f2f0e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{title}}">
<link rel="icon" href="{{icon}}">
<style>
/* This page is the game, framed the way the gallery frames it: the same header
   over the same square board on the gallery's own colour. So following this URL
   lands where pressing the card on the front page lands, and the card can be
   handed straight to it. */
@view-transition { navigation: auto; }
* { box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; }
/* Reserved here as well as on the gallery, so the viewport is the same width
   on both sides of the transition and nothing slides sideways. */
html { background: #f2f0e5; scrollbar-gutter: stable; }
/* Nothing on this page is text to take away: a drag across the board is the
   game being played, not a selection. */
body {
  height: 100dvh;
  padding: 26px;
  display: flex;
  flex-direction: column;
  font: 14px/1.45 Verdana, sans-serif;
  color: #212123;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* The same rules as the gallery's, so the site's name is in the same place and
   the same size on both pages and the transition leaves it where it is. Here
   it carries an arrow and is the link back; the game's name is the middle. The
   height is fixed because the board below is sized off it. */
header {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: 12px;
  height: 28px;
  margin: 0 0 24px;
}
.site { margin: 0; font: bold 19px/1.45 Verdana, sans-serif; letter-spacing: -.02em; }
.by { margin: 0; font-size: 11px; color: #21212399; }
.game {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  font: bold 19px/1.45 Verdana, sans-serif;
  letter-spacing: -.02em;
}
header a { color: inherit; }
.site a { text-decoration: none; }
.site a:hover { text-decoration: underline; }
/* The arrow is the way back, and only leads anywhere on a game's page. The wall
   carries the same glyph and hides it, so the site's name starts at the same x
   on both pages and the transition does not slide it sideways. */
.arrow { visibility: hidden; }
a .arrow { visibility: visible; }
/* Too narrow to centre the game's name without it landing on the byline, so it
   goes to the far end instead. */
@media (max-width: 560px) {
  .game { position: static; transform: none; margin-left: auto; }
}

/* The board, centred in what the header leaves: 100dvh less this page's
   padding, the header and its margin. one.js paints it meta.bg too, for
   dev.html and anywhere else the canvas is hung; this rule is what colours it
   in the first frame drawn. */
.board {
  position: relative;
  margin: auto;
  width: min(calc(100dvh - 104px), 100%);
  aspect-ratio: 1;
  background: {{bg}};
  view-transition-name: board;
}
/* No ring: alma's Input focuses the canvas at startup so the keys arrive
   without a click first, and that is a focus nobody asked for. */
canvas:focus-visible { outline: none; }
canvas { display: block; cursor: pointer; touch-action: none; }
/* Both pages carry these: the pseudo-elements belong to whichever document is
   arriving, so each direction reads the destination's copy. The board morphs
   for 420ms; the game underneath is solid a third of the way in, since it has
   drawn a frame before this page is ever shown. */
::view-transition-group(board) {
  animation-duration: 420ms;
  animation-timing-function: cubic-bezier(.4,0,.15,1);
}
::view-transition-old(board) { animation-duration: 300ms; }
::view-transition-new(board) { animation-duration: 140ms; }
</style>
</head>
<body>
<header>
  <p class="site"><a id="back" href="../"><span class="arrow">&larr;</span> one tiny game</a></p>
  <p class="by">by <a href="https://fserb.com">fserb</a></p>
  <h1 class="game">{{title}}</h1>
</header>
<main class="board"><canvas id="canvas"></canvas></main>
<script type="module">
/*
 * Back to the wall. Going back restores it from the back/forward cache, scroll
 * and playing clips and all, so a traversal is the right move whenever this
 * page was reached from there. Anything else follows the link and loads it.
 */
const back = document.getElementById("back");
const home = new URL("../", location.href).href;

back.addEventListener("click", (ev) => {
  if (globalThis.navigation?.activation?.from?.url !== home) return;
  ev.preventDefault();
  history.back();
});

// alma's Input cancels the default on every key it tracks but never stops the
// event, so Escape still arrives here with the board holding the keyboard.
addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") back.click();
});
</script>
<script type="module">{{script}}</script>
</body>
</html>
